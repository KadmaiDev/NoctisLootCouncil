[project]
name = "noctis-loot-bot"
version = "0.1.0"
description = "Discord loot bot and Windows companion app for the Noctis guild's loot system (WoW: Forever)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
